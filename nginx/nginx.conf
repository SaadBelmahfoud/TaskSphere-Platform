# ═══════════════════════════════════════════════════════════════════
# NGINX — Reverse Proxy pour TaskSphere Platform
# ═══════════════════════════════════════════════════════════════════
#
# ARCHITECTURE :
# ┌──────────┐     ┌──────────┐     ┌──────────┐
# │ Client   │ ──→ │  Nginx   │ ──→ │ Backend  │
# │ Navigateur│ HTTPS │ :443   │ HTTP │ :8080    │
# └──────────┘     └──────────┘     └──────────┘
#
# Nginx fait du SSL termination :
# - Reçoit les requêtes HTTPS du client
# - Déchiffre le trafic SSL
# - Forward en HTTP vers le backend Spring Boot
# - Le backend n'a PAS besoin de gérer le SSL lui-même
#
# UTILISATION :
# 1. Générer les certificats : bash nginx/ssl/generate-cert.sh
# 2. Décommenter le service nginx dans docker-compose.yml
# 3. docker compose up -d

# ──────────────────────────────────────────────
# WORKER PROCESSES
# ──────────────────────────────────────────────
# auto = un worker par cœur CPU
worker_processes auto;

events {
    # Max 1024 connexions simultanées par worker
    worker_connections 1024;
}

http {
    # ──────────────────────────────────────────────
    # SETTINGS DE BASE
    # ──────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Format de log
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Optimisation : sendfile pour transférer les fichiers statiques
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Timeout keepalive
    keepalive_timeout 65;

    # Gzip compression (réduit la taille des réponses)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ──────────────────────────────────────────────
    # UPSTREAM : Backend Spring Boot
    # ──────────────────────────────────────────────
    # "backend" = nom du service docker-compose
    upstream backend {
        server backend:8080;
    }

    # ──────────────────────────────────────────────
    # SERVER : HTTP → Redirect vers HTTPS
    # ──────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Rediriger TOUT le trafic HTTP vers HTTPS
        return 301 https://$host$request_uri;
    }

    # ──────────────────────────────────────────────
    # SERVER : HTTPS (port 443)
    # ──────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        # ──────────────────────────────────────
        # CERTIFICATS SSL
        # ──────────────────────────────────────
        # Pour le DEV : certificat auto-signé (generate-cert.sh)
        # Pour la PROD : certificat Let's Encrypt (certbot)
        ssl_certificate     /etc/nginx/ssl/tasksphere.crt;
        ssl_certificate_key /etc/nginx/ssl/tasksphere.key;

        # Protocoles SSL sécurisés (désactiver les anciens)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Session SSL cache (performances)
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 5m;

        # ──────────────────────────────────────
        # HEADERS DE SÉCURITÉ
        # ──────────────────────────────────────
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ──────────────────────────────────────
        # PROXY VERS LE BACKEND SPRING BOOT
        # ──────────────────────────────────────
        location / {
            proxy_pass http://backend;

            # Headers de proxy standard
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (pour futures features temps réel)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ──────────────────────────────────────
        # ACTUATOR ENDPOINTS (pas de cache)
        # ──────────────────────────────────────
        location /actuator/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Pas de cache pour les endpoints de monitoring
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # ──────────────────────────────────────
        # SWAGGER UI (fichiers statiques + API docs)
        # ──────────────────────────────────────
        location /swagger-ui/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /v3/api-docs {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}