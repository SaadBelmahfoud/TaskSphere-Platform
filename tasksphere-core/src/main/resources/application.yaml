spring:
  application:
    name: TaskSphere-Core

  # ═══════════════════════════════════════════
  # SOURCE DE DONNÉES : H2 EN MÉMOIRE
  # ═══════════════════════════════════════════
  # H2 est une base de données Java embarquée.
  # Mode "mem" = tout est en mémoire (perdu au redémarrage).
  # Pour la production, remplacer par PostgreSQL/MySQL.
  datasource:
    url: jdbc:h2:mem:taskspheredb
    driver-class-name: org.h2.Driver

  # JPA / HIBERNATE
  jpa:
    hibernate:
      ddl-auto: update    # Crée/met à jour les tables automatiquement
    show-sql: true         # Affiche les requêtes SQL dans les logs (utile en dev)
    open-in-view: false    # ← IMPORTANT : empêche le lazy loading hors transaction

  # CONSOLE H2 (interface web d'administration)
  h2:
    console:
      enabled: true                    # Active la console
      settings:
        web-allow-others: false        # Sécurité : pas d'accès externe

# ═════════════════════════════════════════════
# JWT : Clé secrète pour la signature des tokens
# ═════════════════════════════════════════════
# ═══════════════════════════════════════════════════════════════════
# PHASE 1 — CORRECTION P0-1 : Suppression du default JWT_SECRET
# ═══════════════════════════════════════════════════════════════════
#
# AVANT (CRITIQUE — OWASP A07:2021 Security Misconfiguration) :
#   secret: ${JWT_SECRET:tasksphere-dev-secret-key-change-me-in-production-256bits}
#   → Si JWT_SECRET n'est pas défini, l'application démarre avec une clé codée en dur
#   → Cette clé est VISIBLE dans le code source (repo Git public)
#   → Un attaquant peut forger des tokens JWT valides !
#   → C'est une FAILLE DE SÉCURITÉ CRITIQUE
#
# APRÈS (Fail-Fast) :
#   secret: ${JWT_SECRET}
#   → Si JWT_SECRET n'est pas défini → l'application CRASH au démarrage
#   → C'est le comportement SOUHAITÉ : on préfère un crash qu'une sécurité compromise
#   → Le dev local DOIT configurer JWT_SECRET dans son .env ou IDE
#
# PRINCIPE FAIL-FAST :
#   En sécurité, il vaut mieux FAIL que FAIL OPEN.
#   "Fail open" = laisser passer la requête même si la sécurité est incomplète.
#   "Fail fast" = bloquer immédiatement si la sécurité est incomplète.
# ═══════════════════════════════════════════════════════════════════
jwt:
  secret: ${JWT_SECRET}

# Port du serveur
server:
  port: 8080

# Swagger / OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true

# ═══════════════════════════════════════════════════════════════════
# SPRING BOOT ACTUATOR — Monitoring de l'application
# ═══════════════════════════════════════════════════════════════════
#
# PRINCIPE : Actuator expose des endpoints de monitoring.
# En développement, on expose tout pour le diagnostic.
# En production, on n'expose que health et info.
#
# ═══════════════════════════════════════════════════════════════════
# CORRECTION SPRINT 5 — Suppression des health groups readiness/liveness
# ═══════════════════════════════════════════════════════════════════
#
# PROBLÈME :
#   Les health groups "readiness" et "liveness" référenciaient
#   "readinessState" et "livenessState" qui nécessitent la dépendance
#   spring-boot-starter-availability (NON présente dans le projet).
#   → Erreur au démarrage : "Included health contributor 'readinessState'
#     in group 'readiness' does not exist"
#   → L'application CRASH en boucle (restart_policy: unless-stopped)
#
# SOLUTION :
#   Supprimer les health groups readiness/liveness de application.yaml.
#   Ces groups sont utiles SEULEMENT si on utilise les
#   Kubernetes Probes (Liveness/Readiness), ce qui nécessite :
#     1. La dépendance spring-boot-starter-availability dans pom.xml
#     2. La propriété management.endpoint.health.probes.enabled=true
#
#   Sans Kubernetes, les health groups par défaut (db, diskSpace, ping)
#   sont suffisants pour Docker healthcheck et monitoring.
#
#   Pour ajouter les probes Kubernetes plus tard :
#     - Ajouter la dépendance dans tasksphere-core/pom.xml :
#       <dependency>
#           <groupId>org.springframework.boot</groupId>
#           <artifactId>spring-boot-starter-availability</artifactId>
#       </dependency>
#     - Ajouter dans application.yaml :
#       management:
#         endpoint:
#           health:
#             probes:
#               enabled: true
#             group:
#               readiness:
#                 include: readinessState,db
#               liveness:
#                 include: livenessState
management:
  endpoints:
    web:
      exposure:
        # En dev : exposer tous les endpoints
        include: health,info,metrics,env,loggers,beans
      base-path: /actuator  # Chemin de base (défaut)
  endpoint:
    health:
      # Détails complets sur la santé (connexion DB, disk space, etc.)
      show-details: always
    info:
      enabled: true
    metrics:
      enabled: true
  # Métriques personnalisées
  metrics:
    tags:
      application: ${spring.application.name}
  info:
    # Construit l'endpoint /actuator/info avec les propriétés info.*
    build:
      enabled: true
    env:
      enabled: true

# Information sur l'application (exposée via /actuator/info)
info:
  app:
    name: TaskSphere Platform
    description: Application de gestion de tâches
    version: 0.0.1-SNAPSHOT