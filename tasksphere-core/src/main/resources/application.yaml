spring:
  application:
    name: TaskSphere-Core

  # ═══════════════════════════════════════════
  # SOURCE DE DONNÉES : H2 EN MÉMOIRE
  # ═══════════════════════════════════════════
  # H2 est une base de données Java embarquée.
  # Mode "mem" = tout est en mémoire (perdu au redémarrage).
  # Pour la production, remplacer par PostgreSQL/MySQL.
  datasource:
    url: jdbc:h2:mem:taskspheredb
    driver-class-name: org.h2.Driver

  # JPA / HIBERNATE
  jpa:
    hibernate:
      ddl-auto: update    # Crée/met à jour les tables automatiquement
    show-sql: true         # Affiche les requêtes SQL dans les logs (utile en dev)
    open-in-view: false    # ← IMPORTANT : empêche le lazy loading hors transaction

  # CONSOLE H2 (interface web d'administration)
  h2:
    console:
      enabled: true                    # Active la console
      settings:
        web-allow-others: false        # Sécurité : pas d'accès externe

  # Taille maximale des fichiers uploadés (Spring Boot)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ═════════════════════════════════════════════
# JWT : Clé secrète pour la signature des tokens
# ═════════════════════════════════════════════
# ═══════════════════════════════════════════════════════════════════
# PHASE 1 — P0-1 : Fail-Fast en PROD uniquement, defaults en DEV
# ═══════════════════════════════════════════════════════════════════
#
# PRINCIPE :
# - application.yaml (DEV/H2) : default autorisé car base temporaire
# - application-postgres.yml (PROD) : PAS de default → crash si manquant
#
# POURQUOI UN DEFAULT EN DEV ?
# → Le développeur clone le repo → ./mvnw spring-boot:run → ça marche
# → Zéro configuration manuelle nécessaire en local
# → La clé par défaut est UNIQUEMENT pour H2 en mémoire (pas de vraies données)
#
# ⚠️ CETTE CLÉ NE DOIT JAMAIS ÊTRE UTILISÉE EN PRODUCTION !
# → application-postgres.yml surcharge avec ${JWT_SECRET} (sans default)
# ═══════════════════════════════════════════════════════════════════
jwt:
  secret: ${JWT_SECRET:dev-local-secret-key-for-tasksphere-minimum-256bits-long}

# ═══════════════════════════════════════════════════════════════════
# PHASE 1 — P0-1 : init.user.password — default en DEV, fail-fast en PROD
# ═══════════════════════════════════════════════════════════════════
#
# EN DEV (H2) :
#   ${INIT_USER_PASSWORD:DevTest123!} → si pas de variable, utilise DevTest123!
#   → Le développeur n'a rien à configurer
#   → La base H2 est détruite au redémarrage (pas de risque)
#
# EN PROD (PostgreSQL) :
#   ${INIT_USER_PASSWORD} → PAS de default → crash si manquant
#   → Obligation de configurer un mot de passe fort
#
# SPRING RELAXED BINDING :
#   init.user.password dans YAML → INIT_USER_PASSWORD en variable d'env
# ═══════════════════════════════════════════════════════════════════
init:
  user:
    password: ${INIT_USER_PASSWORD:DevTest123!}

# ═══════════════════════════════════════════════════════════════════
# PHASE 1 — P1-5 : Configuration des cookies HttpOnly
# ═══════════════════════════════════════════════════════════════════
# En dev : Secure=false (HTTP localhost, les cookies ne passent pas en HTTPS)
# En prod : Secure=true (HTTPS obligatoire, surchargé dans application-postgres.yml)
# ═══════════════════════════════════════════════════════════════════
app:
  cookie:
    secure: false

# Port du serveur
server:
  port: 8080

# Swagger / OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true

# ═══════════════════════════════════════════════════════════════════
# SPRING BOOT ACTUATOR — Monitoring de l'application
# ═══════════════════════════════════════════════════════════════════
# En développement, on expose tout pour le diagnostic.
# En production (application-postgres.yml), on n'expose que health et info.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,beans
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    info:
      enabled: true
    metrics:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  info:
    build:
      enabled: true
    env:
      enabled: true

# Information sur l'application (exposée via /actuator/info)
info:
  app:
    name: TaskSphere Platform
    description: Application de gestion de tâches
    version: 0.0.1-SNAPSHOT

# ═══════════════════════════════════════════════════════════════════
# PHASE 3 — FEATURE 6 : Configuration du stockage local
# ═══════════════════════════════════════════════════════════════════
# Chemin de base pour le stockage des fichiers uploadés.
# En production, remplacer par la config MinIO/S3.
storage:
  local:
    path: ${STORAGE_PATH:./uploads}