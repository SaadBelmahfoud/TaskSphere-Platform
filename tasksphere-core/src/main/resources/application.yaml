spring:
  application:
    name: TaskSphere-Core
  datasource:
    url: jdbc:h2:mem:taskspheredb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true

# Configuration JWT (optionnel en dev, obligatoire en prod)
jwt:
  secret: tasksphere-super-secret-key-change-in-production

server:
  port: 8080